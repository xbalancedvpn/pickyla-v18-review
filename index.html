<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>PICKYLA moved</title>
  <script>
    (async function(){
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r => r.unregister()));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.filter(k => k.startsWith('pickyla-')).map(k => caches.delete(k)));
        }
      } catch (_) {}
      location.replace('https://xbalancedvpn.github.io/pickyla-booking/' + (location.search || '') + (location.hash || ''));
    })();
  </script>
  <meta http-equiv="refresh" content="1;url=https://xbalancedvpn.github.io/pickyla-booking/">
</head>
<body>
  <p>This legacy PICKYLA v18 site has been retired. <a href="https://xbalancedvpn.github.io/pickyla-booking/">Open current PICKYLA</a>.</p>
</body>
</html>
