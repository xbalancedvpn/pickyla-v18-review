name: Seed Real PICKYLA Review

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/seed-real-pickyla.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review repo
        uses: actions/checkout@v4

      - name: Clone live PICKYLA source read-only
        run: git clone --depth 1 https://github.com/xbalancedvpn/pickleballcoaching.git /tmp/pickyla-live

      - name: Copy actual PICKYLA app into review root
        run: |
          rsync -a --delete             --exclude '.git'             --exclude '.github'             /tmp/pickyla-live/app/ ./
          rm -f CNAME
          touch .nojekyll

      - name: Commit actual PICKYLA baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Replace review sandbox with real PICKYLA interface"
            git push
          fi
